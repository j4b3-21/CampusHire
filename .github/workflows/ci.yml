name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (BM4A platform + CampusHire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test (Testcontainers)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            bm4a/platform/target/surefire-reports/
            backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Container images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t campushire-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t campushire-frontend:ci frontend

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate development and production compose files
        run: |
          cp infrastructure/.env.example infrastructure/.env
          docker compose -f infrastructure/docker-compose.yml --profile app config -q
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.example config -q
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.example --profile monitoring config -q
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.prod.yml config -q

      - name: Nginx configuration test
        run: |
          deploy/scripts/gen-self-signed-cert.sh localhost
          docker run --rm --env-file deploy/.env \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/deploy/certs:/etc/nginx/certs:ro" \
            nginx:stable-alpine sh -c '/docker-entrypoint.sh nginx -t'

      - name: Deploy, seed and load-test scripts
        run: |
          for script in deploy/scripts/*.sh deploy/postgres/init/*.sh loadtest/*.sh scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/seed/*.py
          python3 -m json.tool deploy/keycloak/campushire-realm.json >/dev/null
          python3 -m json.tool deploy/monitoring/grafana/dashboards/campushire-api.json >/dev/null
