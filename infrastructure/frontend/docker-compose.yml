services:
  frontend:
    profiles: ["app"]
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are inlined into the browser bundle and Next.js rewrites are resolved
      # during `next build`, so all of these are build-time inputs (rebuild after changing them).
      args:
        API_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_KEYCLOAK_URL: ${KC_HOSTNAME}
        NEXT_PUBLIC_KEYCLOAK_REALM: campushire
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: campushire-web
    image: campushire-frontend:local
    container_name: campushire-frontend
    restart: unless-stopped

    environment:
      API_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_KEYCLOAK_URL: ${KC_HOSTNAME}
      NEXT_PUBLIC_KEYCLOAK_REALM: campushire
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: campushire-web

    # Development-only host port. Keycloak only allows redirects to http://localhost:3000.
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
