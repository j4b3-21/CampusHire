<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
  <h1 style="margin:0 0 16px 0;font-size:20px;line-height:28px;font-weight:600;color:#18181b;" th:text="${title}">Title</h1>
  <p th:each="paragraph : ${paragraphs}" style="margin:0 0 16px 0;white-space:pre-line;" th:text="${paragraph}">Paragraph</p>
  <th:block th:if="${actionUrl != null}">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 8px 0;border-collapse:separate;">
      <tr>
        <td style="border-radius:8px;background-color:#18181b;">
          <a th:href="${actionUrl}" href="#" th:text="${actionLabel}"
             style="display:inline-block;padding:12px 22px;font-size:15px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">Open</a>
        </td>
      </tr>
    </table>
    <p style="margin:16px 0 0 0;font-size:12px;line-height:18px;color:#71717a;word-break:break-all;">
      If the button does not work, open this link: <a th:href="${actionUrl}" href="#" style="color:#52525b;" th:text="${actionUrl}">link</a>
    </p>
  </th:block>
</th:block>
</body>
</html>
