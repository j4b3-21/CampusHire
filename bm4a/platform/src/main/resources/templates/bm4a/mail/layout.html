<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title th:text="${subject}">Subject</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;color:#18181b;-webkit-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f4f4f5;border-collapse:collapse;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:560px;border-collapse:separate;">
        <tr>
          <td style="padding:0 4px 16px 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:24px;font-weight:700;letter-spacing:-0.2px;color:#18181b;">
            <a th:href="${baseUrl}" href="#" style="color:#18181b;text-decoration:none;" th:text="${appName}">BM4A</a>
          </td>
        </tr>
        <tr>
          <td style="background-color:#ffffff;border:1px solid #e4e4e7;border-radius:12px;padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#3f3f46;">
            <th:block th:replace="${content}">Content</th:block>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#71717a;">
            This message was sent by <a th:href="${baseUrl}" href="#" style="color:#71717a;" th:text="${appName}">BM4A</a>.
            It was generated automatically; replies are not monitored.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
