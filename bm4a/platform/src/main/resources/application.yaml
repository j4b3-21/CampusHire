# Base configuration shared by every profile.
# Profile files: application-local.yaml (developer machine), application-prod.yaml (deployments).
# Secrets are always supplied through environment variables; never put real values here.

spring:
  application:
    name: bm4a-platform

  datasource:
    url: jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5432}/${PLATFORM_DB:platform}
    username: ${PLATFORM_DB_USER:platform}
    password: ${PLATFORM_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      # Uploads stream to disk; the files module enforces bm4a.files.max-size on the content itself.
      max-file-size: ${bm4a.files.max-size}
      max-request-size: 26MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis only accelerates (rate limits, schema cache, notification fan-out); callers fall back when it is slow.
      timeout: ${REDIS_TIMEOUT:250ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

  modulith:
    detection-strategy: explicitly-annotated

bm4a:
  app:
    # Product name in e-mail.
    name: ${APP_NAME:BM4A}
    # Public URL of the web application; invitation links are <base-url>/invite/<token>.
    base-url: ${APP_BASE_URL:http://localhost:3000}
  metadata:
    # One-off upgrade aid: write OpenFGA module tuples for modules created before migration V8 (idempotent).
    sync-module-tuples-on-startup: ${BM4A_SYNC_MODULE_TUPLES:false}
    cache:
      # Module schemas in Redis (ADR-007); PostgreSQL stays the source of truth.
      enabled: ${METADATA_CACHE_ENABLED:true}
  notifications:
    email:
      # Without SMTP_HOST nothing is sent and queued e-mails stay pending (see docs/operations/EMAIL.md).
      enabled: ${MAIL_ENABLED:true}
      from: ${MAIL_FROM:}
      smtp:
        host: ${SMTP_HOST:}
        port: ${SMTP_PORT:587}
        username: ${SMTP_USERNAME:}
        password: ${SMTP_PASSWORD:}
        starttls: ${SMTP_STARTTLS:true}
        ssl: ${SMTP_SSL:false}
    stream:
      redis-enabled: ${NOTIFICATIONS_REDIS_ENABLED:true}
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:2346}/realms/${KEYCLOAK_REALM:bm4a}}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${bm4a.security.jwt.issuer-uri}/protocol/openid-connect/certs}
      audience: ${KEYCLOAK_AUDIENCE:bm4a-api}
      platform-admin-role: bm4a-platform-admin
  authz:
    openfga:
      api-url: ${OPENFGA_API_URL:http://localhost:2347}
      api-token: ${OPENFGA_PRESHARED_KEY:}
      store-name: ${OPENFGA_STORE_NAME:bm4a}
      store-id: ${OPENFGA_STORE_ID:}
      model-id: ${OPENFGA_MODEL_ID:}
      bootstrap: false
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    writes-per-minute: ${RATE_LIMIT_WRITES_PER_MINUTE:300}
  files:
    # filesystem (single node, tests) or s3 (MinIO / AWS S3)
    storage: ${FILES_STORAGE:filesystem}
    local-dir: ${FILES_LOCAL_DIR:${java.io.tmpdir}/bm4a-files}
    max-size: 25MB
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:bm4a-files}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
  dataexchange:
    # Zone of date-times without offset in imported files, and of date-times in exports.
    time-zone: ${DATA_EXCHANGE_TIME_ZONE:UTC}
    poll-interval: 2s

logging:
  pattern:
    correlation: "%replace([%X{correlationId}] ){'^\\[\\] $', ''}"

server:
  port: 8080
  shutdown: graceful

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include:
            - readinessState
            - db
  health:
    redis:
      enabled: false
