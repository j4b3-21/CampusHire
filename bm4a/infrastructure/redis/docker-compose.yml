services:
  redis:
    image: redis:8.2
    container_name: bm4a-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    # Development-only host port.
    ports:
      - "127.0.0.1:2349:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  redis-data:
