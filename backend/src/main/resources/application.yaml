# CampusHire base configuration shared by every profile.
# Profile files: application-local.yaml (developer machine), application-prod.yaml (deployments).
# Secrets are always supplied through environment variables; never put real values here.

spring:
  application:
    name: campushire

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5432}/${PLATFORM_DB:campushire}
    username: ${PLATFORM_DB_USER:campushire}
    password: ${PLATFORM_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # Scanned recursively: BM4A platform migrations (V1-V999) and CampusHire migrations in
    # db/migration/campushire (V1000+).
    locations: classpath:db/migration
    # Platform migrations added after CampusHire's V1000+ have lower versions and must still be applied.
    out-of-order: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis only accelerates (rate limits, caches, notification fan-out); callers fall back when it is slow.
      timeout: ${REDIS_TIMEOUT:250ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

  modulith:
    detection-strategy: explicitly-annotated
    events:
      # Completed event publications are not needed after delivery; failed ones stay for resubmission.
      completion-mode: delete

bm4a:
  app:
    name: ${APP_NAME:CampusHire}
    base-url: ${APP_BASE_URL:http://localhost:3000}
  dataexchange:
    time-zone: ${DATA_EXCHANGE_TIME_ZONE:Asia/Kolkata}
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}/realms/${KEYCLOAK_REALM:campushire}}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${bm4a.security.jwt.issuer-uri}/protocol/openid-connect/certs}
      audience: ${KEYCLOAK_AUDIENCE:campushire-api}
      platform-admin-role: campushire-platform-admin
  authz:
    openfga:
      api-url: ${OPENFGA_API_URL:http://localhost:8280}
      api-token: ${OPENFGA_PRESHARED_KEY:}
      store-name: ${OPENFGA_STORE_NAME:campushire}
      store-id: ${OPENFGA_STORE_ID:}
      model-id: ${OPENFGA_MODEL_ID:}
      bootstrap: ${OPENFGA_BOOTSTRAP:false}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    writes-per-minute: ${RATE_LIMIT_WRITES_PER_MINUTE:300}

campushire:
  # Calendar dates (offer deadlines, follow-ups due today) are compared in the institute's zone.
  time-zone: ${CAMPUSHIRE_TIME_ZONE:Asia/Kolkata}
  dashboard:
    cache-ttl: ${CAMPUSHIRE_DASHBOARD_CACHE_TTL:60s}
  projections:
    stats-refresh-interval: ${CAMPUSHIRE_STATS_REFRESH_INTERVAL:5m}
  events:
    resubmit-interval: ${CAMPUSHIRE_EVENTS_RESUBMIT_INTERVAL:60s}

logging:
  pattern:
    correlation: "%replace([%X{correlationId}] ){'^\\[\\] $', ''}"

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include:
            - readinessState
            - db
  health:
    redis:
      enabled: false
