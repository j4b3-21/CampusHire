# Local development profile: ./mvnw -pl backend spring-boot:run -Dspring-boot.run.profiles=local
# Reads backend/.env (copy backend/.env.example) when present. DEVELOPMENT ONLY.

spring:
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  datasource:
    url: jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5442}/${PLATFORM_DB:campushire}

bm4a:
  authz:
    openfga:
      bootstrap: true
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:false}

management:
  endpoint:
    health:
      show-details: always
