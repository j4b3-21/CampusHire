user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"rt":$request_time,"urt":"$upstream_response_time","upstream":"$upstream_addr",'
                                '"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    server_tokens   off;

    # Docker's embedded DNS: upstreams marked `resolve` follow container restarts (new IPs).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/problem+json image/svg+xml application/xml;

    # Only the rendered CampusHire template; the image's default.conf would claim port 80 as well.
    include /etc/nginx/conf.d/campushire.conf;
}
